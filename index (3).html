-shadow:var(--shadow);z-index:30;display:none}.toast.show{display:block}.sector-table{min-width:760px}.sector-table th{background:#f3f6f9}.sector-table tfoot td{font-weight:800;border-top:2px solid #cbd6e2;background:#f7f9fb}.sector-link{color:var(--blue);font-weight:800;background:none;border:0;padding:0;text-align:left}.sector-link:hover{text-decoration:underline}.aggregate{margin-top:15px}.aggregate .panel-header{margin-bottom:6px}.table-note{margin:0 0 12px;font-size:12px;color:var(--muted)}.closure-months{display:flex;gap:4px;flex-wrap:wrap}.closure-months span{font-size:10px;padding:5px 6px;border-radius:5px;background:#eef2f6;color:#7c8b9c}.closure-months span.done{background:#e0f3eb;color:#22815d}

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script src="./firebase-config.js"></script><script type="module">
const AREAS=['Tecnologia','RH','Jurídico','Cobrança','Financeiro','Controladoria']; const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']; const KEY='reducao-despesas-v2';

function saveLocal(){localStorage.setItem(KEY,JSON.stringify(data))} function selected(e){return +e.month.slice(0,4)===view.year&&view.months.includes(+e.month.slice(5))} function latestSnapshot(entries,cutoff){const groups=new Map(); for(const e of entries.filter(x=>x.month<=cutoff).sort((a,b)=>a.month.localeCompare(b.month))) groups.set(e.initiativeId||e.id,e);return [...groups.values()]}
function metrics(entries){let filtered=entries.filter(selected),cutoff=mkey(view.year,Math.max(...view.months)); let through=entries.filter(e=>e.month>=`${view.year}-01`&&e.month<=cutoff);let snapshots=latestSnapshot(entries,cutoff);return {filtered,realized:filtered.reduce((s,e)=>s+n(e.realized),0),ytd:through.reduce((s,e)=>s+n(e.realized),0),projection:snapshots.reduce((s,e)=>s+n(e.remainingForecast),0),count:new Set(filtered.map(e=>e.initiativeId||e.id)).size}}
function sectorSummary(){const rows=AREAS.map(area=>{const m=metrics(areaEntries(area).filter(e=>!view.category||e.categoryId===view.category));const doneMonths=view.months.filter(month=>closed(area,mkey(view.year,month))).length;const status=doneMonths===view.months.length?'Finalizado':doneMonths?'Parcial':'Em aberto';return {area,...m,doneMonths,status}});return `<section class="panel aggregate"><div class="panel-header"><div><h2>Resumo por setor</h2><span class="muted small">Comparativo do período selecionado · ${view.months.length===1?MONTHS[view.months[0]-1]:view.months.length+' meses'} ${view.year}</span></div></div><p class="table-note">Selecione um setor para abrir seus lançamentos detalhados. A projeção considera a última posição de cada projeto até o mês final selecionado.</p><div class="table-scroll"><table class="sector-table"><thead><tr><th>Departamento</th><th class="text-right">Valor mês / período</th><th class="text-right">Projeção ano</th><th class="text-right">Ações</th><th>Fechamento</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="sector-link" data-open-area="${esc(r.area)}">${esc(r.area)}</button></td><td class="money text-right">${money(r.realized)}</td><td class="money text-right">${money(r.projection)}</td><td class="text-right">${r.count}</td><td><span class="status ${r.status==='Finalizado'?'done':r.status==='Parcial'?'partial':'open'}">${r.status}${r.status==='Parcial'?` · ${r.doneMonths}/${view.months.length}`:''}</span></td></tr>`).join('')}</tbody><tfoot><tr><td>TOTAL GERAL</td><td class="money text-right">${money(rows.reduce((s,r)=>s+r.realized,0))}</td><td class="money text-right">${money(rows.reduce((s,r)=>s+r.projection,0))}</td><td class="text-right">${rows.reduce((s,r)=>s+r.count,0)}</td><td></td></tr></tfoot></table></div></section>`}
function render(){if(view.remote&&!view.user){$('#areaNav').innerHTML='';$('#app').innerHTML=`<div class="login panel"><div class="eyebrow">Acesso compartilhado</div><h1>Redução de despesas</h1><p class="sub">Entre com o usuário criado no Firebase Authentication.</p><form id="loginForm"><div class="field"><label>E-mail</label><input type="email" name="email" required></div><div class="field"><label>Senha</label><input type="password" name="password" required></div><button class="btn primary" style="width:100%">Entrar</button></form></div>`;$('#loginForm').onsubmit=login;return}
 $('#areaNav').innerHTML=[...AREAS,'Clóvis'].map(a=>`<button class="area-btn ${view.area===a?'active':''}" data-area="${esc(a)}"><span>${a==='Clóvis'?'▦':'◦'}</span>${esc(a)}${a==='Clóvis'?'<small>GERAL</small>':''}</button>`).join(''); document.querySelectorAll('[data-area]').forEach(x=>x.onclick=()=>{view.area=x.dataset.area;view.category='';render()});
 const entries=areaEntries(view.area).filter(e=>!view.category||e.categoryId===view.category);const m=metrics(entries);const sel=view.months.length===1?`${MONTHS[view.months[0]-1]} ${view.year}`:`${view.months.length} meses selecionados`;const categories=data.categories.filter(c=>!c.deleted&&(view.area==='Clóvis'||c.area===view.area));let editable=view.area!=='Clóvis'&&canEdit(view.area), one=view.months.length===1, month=mkey(view.year,view.months[0]);
 $('#app').innerHTML=`<div class="top"><div><div class="eyebrow">PAINEL DE GESTÃO / ${view.year}</div><h1>${view.area==='Clóvis'?'Visão geral · Clóvis':esc(view.area)}</h1><p class="sub">Economias realizadas, ações e perspectiva para o ano.</p></div><div class="top-actions"><span class="badge ${view.remote?'live':''}">${view.remote?'● Compartilhado':'● Neste navegador'}</span>${view.remote?'<button class="btn" id="logout">Sair</button>':''}<button class="btn" id="export">↓ Exportar CSV</button>${editable?'<button class="btn primary" id="add">+ Nova ação</button>':''}</div></div>
 ${!view.remote?'<div class="notice"><strong>Modo local.</strong> Os dados ficam apenas neste navegador. Para que outras pessoas vejam e editem em tempo real, configure o Firebase conforme o guia incluído. <button class="btn" id="import" style="margin-left:10px;padding:6px 10px">Importar histórico JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden></div>':view.profile?`<div class="notice" style="background:#eef5fb;border-color:#dce7f2;color:#516780">Conectado como ${esc(view.user.email)} · ${view.profile.role==='admin'?'Administrador':esc(view.profile.area||'Leitura')}${view.profile.role==='admin'?' <button class="btn" id="import" style="margin-left:10px;padding:6px 10px">Importar histórico JSON</button><input id="importFile" type="file" accept=".json,application/json" hidden>':''}</div>`:'<div class="notice">Seu usuário ainda não tem área atribuída. Peça ao administrador para criar seu perfil no Firestore; por enquanto, acesso somente à visualização.</div>'}
 <div class="filters"><div><div class="filter-title">Selecione os meses para a apresentação <span class="muted small">· ${sel}</span></div><div class="month-row">${MONTHS.map((x,i)=>`<button class="month ${view.months.includes(i+1)?'selected':''}" data-month="${i+1}">${x}</button>`).join('')}</div></div><div class="filter-side"><button class="btn" id="allMonths">Ano inteiro</button><select class="select" id="year">${[2025,2026,2027,2028].map(y=>`<option ${view.year===y?'selected':''}>${y}</option>`).join('')}</select><select class="select" id="category"><option value="">Todas as categorias</option>${categories.map(c=>`<option value="${esc(c.id)}" ${view.category===c.id?'selected':''}>${esc(c.name)}${view.area==='Clóvis'?` · ${esc(c.area)}`:''}</option>`).join('')}</select></div></div>
 <section class="cards"><div class="card"><div class="label">Realizado no período</div><div class="value blue">${money(m.realized)}</div><div class="hint">${m.count} ${m.count===1?'ação':'ações'} nos meses selecionados</div></div><div class="card"><div class="label">Realizado no ano</div><div class="value">${money(m.ytd)}</div><div class="hint">Janeiro até ${MONTHS[Math.max(...view.months)-1]} ${view.year}</div></div><div class="card"><div class="label">Projeção ano</div><div class="value amber">${money(m.projection)}</div><div class="hint">Última posição de cada projeto</div></div><div class="card"><div class="label">Projetos no período</div><div class="value">${m.count}</div><div class="hint">Ações com lançamento nos meses marcados</div></div></section>
 ${view.area==='Clóvis'?sectorSummary():''}
 <section class="panel table-panel"><div class="panel-header"><div><h2>${view.area==='Clóvis'?'Ações do período':'Lançamentos e observações'}</h2><div class="muted small" style="margin-top:4px">${view.area==='Clóvis'?'Detalhamento consolidado das áreas':'Registros da área nos meses selecionados'}</div></div>${editable&&one?`<button class="btn ${closed(view.area,month)?'':'primary'}" id="toggleClose">${closed(view.area,month)?'✓ Mês finalizado · reabrir':'○ Finalizar '+MONTHS[view.months[0]-1]}</button>`:''}${editable?'<button class="btn" id="manageCat">Categorias</button>':''}</div><div class="table-scroll"><table><thead><tr><th>Mês / área</th><th>Projeto</th><th>Ação / descrição</th><th class="text-right">Valor mês</th><th class="text-right">Projeção ano</th><th>Status</th><th></th></tr></thead><tbody>${m.filtered.length?m.filtered.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(e=>`<tr><td>${MONTHS[+e.month.slice(5)-1]} ${e.month.slice(0,4)}<small>${esc(e.area)}</small></td><td><strong>${esc(catName(e.categoryId))}</strong><small>${esc(e.title||'')}</small></td><td style="max-width:350px">${esc(e.note||'—')}${e.legacy?'<small>Importado da planilha</small>':''}</td><td class="money text-right">${money(e.realized)}</td><td class="money text-right">${money(e.remainingForecast)}</td><td><span class="status ${closed(e.area,e.month)?'done':'open'}">${closed(e.area,e.month)?'Finalizado':'Em aberto'}</span></td><td>${canEdit(e.area)&&!closed(e.area,e.month)?`<button class="icon-btn" data-edit="${esc(e.id)}" title="Editar">✎</button><button class="icon-btn" data-delete="${esc(e.id)}" title="Excluir">×</button>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhum lançamento para os meses selecionados.</td></tr>'}</tbody></table></div></section>
 ${view.area==='Clóvis'?`<section class="panel table-panel"><div class="panel-header"><div><h2>Fechamento mensal por setor</h2><div class="muted small">✓ indica mês finalizado</div></div></div>${AREAS.map(a=>`<div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;margin:9px 0"><strong style="font-size:12px">${esc(a)}</strong><div class="closure-months">${MONTHS.map((x,i)=>`<span class="${closed(a,mkey(view.year,i+1))?'done':''}">${x}${closed(a,mkey(view.year,i+1))?' ✓':''}</span>`).join('')}</div></div>`).join('')}</section>`:''}`;
 document.querySelectorAll('[data-month]').forEach(b=>b.onclick=ev=>{let val=+b.dataset.month;view.months=ev.shiftKey?[val]:view.months.includes(val)?view.months.filter(x=>x!==val):[...view.months,val].sort((a,b)=>a-b);if(!view.months.length)view.months=[val];render()});document.querySelectorAll('[data-open-area]').forEach(b=>b.onclick=()=>{view.area=b.dataset.openArea;view.category='';render()});$('#allMonths').onclick=()=>{view.months=Array.from({length:12},(_,i)=>i+1);render()};$('#year').onchange=e=>{view.year=+e.target.value;render()};$('#category').onchange=e=>{view.category=e.target.value;render()};$('#export').onclick=exportCsv;if($('#logout'))$('#logout').onclick=()=>api.signOut();if($('#add'))$('#add').onclick=()=>entryModal();if($('#manageCat'))$('#manageCat').onclick=categoryModal;if($('#toggleClose'))$('#toggleClose').onclick=()=>toggleClosure(view.area,month);if($('#import')){$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=importHistory}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>entryModal(data.entries.find(e=>e.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeEntry(b.dataset.delete));

function categoryBars(entries){const map=new Map();entries.forEach(e=>{const key=catName(e.categoryId),v=map.get(key)||0;map.set(key,v+n(e.realized))});let rows=[...map].sort((a,b)=>b[1]-a[1]).slice(0,6),max=Math.max(1,...rows.map(x=>x[1]));return rows.length?rows.map(([name,val])=>`<div class="category-row"><div class="cat-top"><strong>${esc(name)}</strong><span>${money(val)}</span></div><div class="track"><div class="fill" style="width:${val/max*100}%"></div></div></div>`).join(''):'<div class="empty">Sem dados no período</div>'}
function show(html){$('#modal').innerHTML=html;$('#overlay').classList.add('show');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))hide()}}function hide(){$('#overlay').classList.remove('show')}const option=(value,label,selected)=>`<option value="${esc(value)}" ${selected?'selected':''}>${esc(label)}</option>`;
function entryModal(e){let area=e?.area||view.area, month=e?.month||mkey(view.year,view.months[0]);if(closed(area,month)){toast('Reabra o mês para editar lançamentos.');return}let cats=data.categories.filter(c=>c.area===area&&!c.deleted), initiatives=[...new Map(data.entries.filter(x=>x.area===area&&!x.legacy&&x.initiativeId!==e?.initiativeId).map(x=>[x.initiativeId,x])).values()];if(e&&!e.legacy)initiatives.unshift(e);show(`<h2>${e?'Editar lançamento':'Nova ação de redução'}</h2><p>Informe o valor do mês, a projeção do ano e a descrição da ação.</p><form id="entryForm"><div class="grid2"><div class="field"><label>Área</label><input value="${esc(area)}" disabled></div><div class="field"><label>Mês de referência</label><input name="month" type="month" min="2025-01" max="2028-12" value="${esc(month)}" required></div></div><div class="field"><label>Ação existente (opcional)</label><select name="initiative"><option value="">Nova ação</option>${initiatives.map(x=>option(x.initiativeId,`${x.title||catName(x.categoryId)} · ${x.month}`,e?.initiativeId===x.initiativeId)).join('')}</select></div><div class="grid2"><div class="field"><label>Categoria</label><select name="categoryId" required><option value="">Escolha</option>${cats.map(c=>option(c.id,c.name,e?.categoryId===c.id)).join('')}</select></div><div class="field"><label>Projeto</label><input name="title" placeholder="Ex.: Negociação com fornecedor" value="${esc(e?.title||'')}" required maxlength="120"></div></div><div class="grid2"><div class="field"><label>Valor mês (R$)</label><input name="realized" type="number" step="0.01" min="0" value="${e?.realized??''}" required></div><div class="field"><label>Projeção ano (R$)</label><input name="remainingForecast" type="number" step="0.01" min="0" value="${e?.remainingForecast??''}" required></div></div><div class="field"><label>Ação / descrição</label><textarea name="note" placeholder="Ex.: Conseguimos desconto no contrato sem perder qualidade">${esc(e?.note||'')}</textarea></div><div class="hintbox">Use a mesma lógica da planilha: VALOR MÊS é o que reduziu no mês; PROJEÇÃO ANO é a projeção anual associada ao projeto; AÇÃO descreve o que foi feito.</div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar lançamento</button></div></form>`);$('#cancel').onclick=hide;let form=$('#entryForm');form.elements.namedItem('initiative').onchange=()=>{let old=data.entries.find(x=>x.initiativeId===form.elements.namedItem('initiative').value);if(old){form.elements.namedItem('categoryId').value=old.categoryId;form.elements.namedItem('title').value=old.title||catName(old.categoryId)}};form.onsubmit=async ev=>{ev.preventDefault();const v=Object.fromEntries(new FormData(form));if(closed(area,v.month)){toast('Este mês está finalizado. Reabra para alterar.');return}if(v.month.slice(0,4)!==String(view.year))view.year=+v.month.slice(0,4);let initiativeId=v.initiative||e?.initiativeId||uid(), record={id:e?.id||uid(),area,month:v.month,categoryId:v.categoryId,initiativeId,title:v.title.trim(),realized:n(v.realized),remainingForecast:n(v.remainingForecast),note:v.note.trim(),legacy:false,updatedAt:new Date().toISOString()};if(data.entries.some(x=>x.id!==record.id&&x.initiativeId===initiativeId&&x.month===record.month)){toast('Esta ação já tem um lançamento nesse mês. Edite o registro existente.');return}try{await put('entries',record);hide();view.months=[+v.month.slice(5)];render();toast('Lançamento salvo.')}catch(err){toast(err.message)}}}
function categoryModal(){let area=view.area;let rows=data.categories.filter(c=>c.area===area&&!c.deleted);show(`<h2>Categorias · ${esc(area)}</h2><p>Renomear atualiza a categoria de todos os lançamentos associados. Excluir remove a categoria das opções futuras e conserva o histórico.</p><div class="cat-list">${rows.length?rows.map(c=>`<div class="cat-line"><span>${esc(c.name)}</span><div><button class="icon-btn" data-rename="${esc(c.id)}" title="Renomear">✎</button><button class="icon-btn" data-archive="${esc(c.id)}" title="Excluir">×</button></div></div>`).join(''):'<div class="empty">Crie a primeira categoria.</div>'}</div><form id="catForm" style="display:flex;gap:7px;margin-top:18px"><input class="select" name="name" placeholder="Nova categoria, ex.: Contratos" required maxlength="60" style="flex:1;min-width:0"><button class="btn primary">Adicionar</button></form><div class="modal-actions"><button class="btn" id="cancel">Concluir</button></div>`);$('#cancel').onclick=hide;$('#catForm').onsubmit=async ev=>{ev.preventDefault();let name=ev.target.elements.namedItem('name').value.trim();if(data.categories.some(c=>c.area===area&&!c.deleted&&c.name.toLowerCase()===name.toLowerCase()))return toast('Esta categoria já existe.');try{await put('categories',{id:uid(),area,name,deleted:false});categoryModal();render()}catch(err){toast(err.message)}};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=async()=>{let c=data.categories.find(x=>x.id===b.dataset.rename),name=prompt('Novo nome da categoria:',c.name)?.trim();if(!name||name===c.name)return;if(data.categories.some(x=>x.id!==c.id&&x.area===area&&!x.deleted&&x.name.toLowerCase()===name.toLowerCase()))return toast('Esta categoria já existe.');try{await put('categories',{...c,name});categoryModal();render()}catch(err){toast(err.message)}});document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{let c=data.categories.find(x=>x.id===b.dataset.archive);if(!confirm(`Excluir “${c.name}” das opções? Os registros existentes continuarão visíveis.`))return;try{await put('categories',{...c,deleted:true});categoryModal();render()}catch(err){toast(err.message)}})}
async function importHistory(ev){let file=ev.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.entries)||!Array.isArray(parsed.categories)||parsed.version!==1)throw Error('Arquivo incompatível.');let c=parsed.categories.filter(x=>x.id&&x.area&&x.name&&!data.categories.some(v=>v.id===x.id));let e=parsed.entries.filter(x=>x.id&&x.area&&x.month&&!data.entries.some(v=>v.id===x.id));if(!confirm(`Importar ${c.length} categorias e ${e.length} lançamentos? Os campos Projeto, Valor mês, Projeção ano e Ação serão trazidos da planilha.`))return;for(let x of c)await put('categories',x);for(let x of e)await put('entries',x);render();toast(`${e.length} lançamentos importados.`)}catch(err){toast('Falha na importação: '+err.message)}}
async function toggleClosure(area,month){let existing=data.closures.find(x=>x.area===area&&x.month===month),done=!existing?.done;if(!confirm(done?`Finalizar ${month} de ${area}? Os lançamentos ficarão bloqueados até reabrir.`:`Reabrir ${month} de ${area} para edição?`))return;try{await put('closures',{id:`${area}-${month}`,area,month,done,updatedAt:new Date().toISOString()});render();toast(done?'Período finalizado.':'Período reaberto.')}catch(err){toast(err.message)}}
async function removeEntry(id){let e=data.entries.find(x=>x.id===id);if(!e||closed(e.area,e.month))return;if(!confirm(`Excluir o lançamento de ${e.month} (${exact(e.realized)})?`))return;try{await del('entries',id);render();toast('Lançamento excluído.')}catch(err){toast(err.message)}}
async function put(kind,record){if(view.remote){if(!canEdit(record.area))throw Error('Sem permissão para editar esta área.');await api.put(kind,record);return}let arr=data[kind],i=arr.findIndex(x=>x.id===record.id);if(i<0)arr.push(record);else arr[i]=record;saveLocal()}
async function del(kind,id){if(view.remote){await api.del(kind,id);return}data[kind]=data[kind].filter(x=>x.id!==id);saveLocal()}
function exportCsv(){let rows=[['Área','Mês','Categoria','Ação','Realizado','Projeção ano','Observação','Status'],...areaEntries(view.area).filter(selected).map(e=>[e.area,e.month,catName(e.categoryId),e.title||'',e.realized,e.remainingForecast,e.note||'',closed(e.area,e.month)?'Finalizado':'Em aberto'])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`reducao-despesas-${view.area}-${view.year}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function login(ev){ev.preventDefault();let f=new FormData(ev.target);try{await api.login(f.get('email'),f.get('password'))}catch(err){toast('Não foi possível entrar. Confira e-mail e senha.')}}
async function connect(){if(!window.FIREBASE_CONFIG?.apiKey){render();return}try{const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut},{getFirestore,collection,doc,setDoc,deleteDoc,onSnapshot,getDoc}]=await Promise.all([import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);let app=initializeApp(window.FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);view.remote=true;api={login:(email,pw)=>signInWithEmailAndPassword(auth,email,pw),signOut:()=>signOut(auth),put:(kind,r)=>setDoc(doc(db,kind,r.id),r),del:(kind,id)=>deleteDoc(doc(db,kind,id))};onAuthStateChanged(auth,async user=>{unsub.forEach(f=>f());unsub=[];view.user=user;view.profile=null;data=blank();if(user){try{let snap=await getDoc(doc(db,'profiles',user.uid));if(snap.exists())view.profile=snap.data()}catch(err){toast('Não foi possível carregar o perfil.')}for(let kind of ['categories','entries','closures'])unsub.push(onSnapshot(collection(db,kind),snap=>{data[kind]=snap.docs.map(x=>x.data());render()},err=>toast('Falha ao sincronizar '+kind+': '+err.message)))}render()});render()}catch(err){view.remote=false;toast('Falha na configuração do Firebase. Usando modo local.');render()}}
connect();
</script></body></html>
